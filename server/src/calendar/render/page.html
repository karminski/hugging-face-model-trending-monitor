<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <script type="importmap">
      { "imports": { "three": "/three/three.module.js" } }
    </script>
    <style>
      body { margin: 0; background: #fff; }
    </style>
  </head>
  <body>
    <script type="module">
      import * as THREE from "three";

      function mulberry32(seed) {
        let a = seed >>> 0;
        return () => {
          a = (a + 0x6d2b79f5) >>> 0;
          let t = a;
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      function toModule(code) {
        let src = code.trim();
        if (!/export\s+default/.test(src)) {
          if (/function\s+build\s*\(/.test(src)) src += "\nexport default build;";
          else throw new Error("scene_js has no `export default` build function");
        }
        return src;
      }

      function disposeScene(scene) {
        scene.traverse((o) => {
          o.geometry?.dispose();
          for (const m of [o.material].flat()) m?.dispose();
        });
      }

      /**
       * Builds a fresh scene for every t with the same seed, so static content is identical
       * across frames and only t-driven motion changes.
       */
      window.renderScene = async ({ code, width, height, ctx, seed, ts }) => {
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        document.body.appendChild(canvas);
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
        renderer.setPixelRatio(1);
        renderer.setSize(width, height, false);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFShadowMap;
        const gl = renderer.getContext();
        const stride = width * 4;

        const url = URL.createObjectURL(new Blob([toModule(code)], { type: "text/javascript" }));
        try {
          const mod = await import(url);
          if (typeof mod.default !== "function") throw new Error("default export is not a function");
          const frames = [];
          for (const t of ts) {
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0xffffff);
            const camera = new THREE.PerspectiveCamera(40, width / height, 0.1, 200);
            camera.position.set(0, 3, 10);
            camera.lookAt(0, 1, 0);
            const rng = mulberry32(seed);
            // Math.random is replaced so accidental use stays deterministic.
            Math.random = mulberry32(seed ^ 0x9e3779b9);
            await mod.default({ THREE, scene, camera, renderer, rng, ctx, t });
            renderer.render(scene, camera);
            const pixels = new Uint8Array(width * height * 4);
            gl.readPixels(0, 0, width, height, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
            // WebGL rows are bottom-up.
            const flipped = new Uint8Array(pixels.length);
            for (let y = 0; y < height; y++)
              flipped.set(pixels.subarray((height - 1 - y) * stride, (height - y) * stride), y * stride);
            frames.push(Array.from(flipped));
            disposeScene(scene);
          }
          return { ok: true, frames };
        } catch (err) {
          return { ok: false, error: String(err && err.stack ? err.stack : err) };
        } finally {
          URL.revokeObjectURL(url);
          renderer.dispose();
          canvas.remove();
        }
      };
      window.rendererReady = true;
    </script>
  </body>
</html>
